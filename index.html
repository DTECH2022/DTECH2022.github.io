<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Coast Audio Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .product:hover {
      transform: scale(1.03);
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      font-size: 18px;
      margin: 10px 0;
    }
    .product p {
      margin: 5px 0;
      font-weight: bold;
      color: #e63946;
    }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #1eb54b;
    }
    footer {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Green Coast Audio Shop</h1>
    <p>Drive with Sound & Style 🚗🎶</p>
  </header>

  <main class="container">
    <!-- Product 1 -->
    <div class="product">
      <img src="https://via.placeholder.com/250x200" alt="Car Radio">
      <h2>Car Radio</h2>
      <p>KSH 8,500</p>
      <a class="btn" href="https://wa.me/254704965666?text=Hello%20Green%20Coast%20Audio!%20I'm%20interested%20in%20the%20Car%20Radio%20(KSH%208,500).">Negotiate on WhatsApp</a>
    </div>

    <!-- Product 2 -->
    <div class="product">
      <img src="https://via.placeholder.com/250x200" alt="Subwoofer">
      <h2>Subwoofer</h2>
      <p>KSH 15,000</p>
      <a class="btn" href="https://wa.me/254704965666?text=Hello%20Green%20Coast%20Audio!%20I'm%20interested%20in%20the%20Subwoofer%20(KSH%2015,000).">Negotiate on WhatsApp</a>
    </div>

    <!-- Product 3 -->
    <div class="product">
      <img src="https://via.placeholder.com/250x200" alt="Dash Camera">
      <h2>Dash Camera</h2>
      <p>KSH 6,000</p>
      <a class="btn" href="https://wa.me/254704965666?text=Hello%20Green%20Coast%20Audio!%20I'm%20interested%20in%20the%20Dash%20Camera%20(KSH%206,000).">Negotiate on WhatsApp</a>
    </div>

    <!-- Product 4 -->
    <div class="product">
      <img src="https://via.placeholder.com/250x200" alt="Car Accessories">
      <h2>Car Accessories</h2>
      <p>KSH 2,500</p>
      <a class="btn" href="https://wa.me/254704965666?text=Hello%20Green%20Coast%20Audio!%20I'm%20interested%20in%20the%20Car%20Accessories%20(KSH%202,500).">Negotiate on WhatsApp</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Green Coast Audio | WhatsApp: 0704965666</p>

</body>
</html>
